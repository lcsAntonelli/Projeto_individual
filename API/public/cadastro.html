<script>

  // Array para armazenar empresas cadastradas para validação de código de ativação 
  let listaEmpresasCadastradas = [];

  // Confere a senha caractere por caractere e devolve um vetor
  // com tudo o que ainda está faltando (vazio = senha forte)
  function validarSenha(senha) {
    var minusculas = "abcdefghijklmnopqrstuvwxyz".split("");
    var maiusculas = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    var numeros = "0123456789".split("");
    var especiais = ["!", "@", "#", "$", "%", "&", "*", "?", ":", ".", ",", "-", "_", "+", "="];

    var temMinuscula = false;
    var temMaiuscula = false;
    var temNumero = false;
    var temEspecial = false;

    // Percorre a senha e marca o que foi encontrado
    for (var i = 0; i < senha.length; i++) {
      var caractere = senha[i];

      if (minusculas.includes(caractere)) {
        temMinuscula = true;
      } else if (maiusculas.includes(caractere)) {
        temMaiuscula = true;
      } else if (numeros.includes(caractere)) {
        temNumero = true;
      } else if (especiais.includes(caractere)) {
        temEspecial = true;
      }
    }

    // Vetor com os requisitos que não foram atendidos
    var faltando = [];

    if (senha.length < 8) {
      faltando.push("pelo menos 8 caracteres");
    }
    if (!temMinuscula) {
      faltando.push("uma letra minúscula");
    }
    if (!temMaiuscula) {
      faltando.push("uma letra maiúscula");
    }
    if (!temNumero) {
      faltando.push("um número");
    }
    if (!temEspecial) {
      faltando.push("um caractere especial (ex.: ! @ # $ % & * ?)");
    }

    return faltando;
  }

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == "" 
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Validando a força da senha antes de cadastrar
    var problemasSenha = validarSenha(senhaVar);

    if (problemasSenha.length > 0) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "Sua senha precisa ter: " + problemasSenha.join(", ") + ".";

      finalizarAguardar();
      return false;
    }

    // Conferindo se a confirmação é igual à senha
    if (senhaVar != confirmacaoSenhaVar) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "As senhas não correspondem!";

      finalizarAguardar();
      return false;
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
